# Sendsprite on Coolify.
#
#   New Resource -> Docker Compose -> point it at this repository and set the
#   compose path to `docker-compose.coolify.yml`.
#
# Coolify assigns the domain, terminates TLS, and generates `APP_SECRET` and the
# Postgres password itself (the `SERVICE_*` names below are its magic variables,
# not values you fill in). Everything else is an ordinary field in Coolify's
# environment tab, prefilled with the defaults shown here.
#
# Use `docker-compose.yml` instead for a plain `docker compose up` on your own
# box; that file publishes its own ports and reads secrets from `.env`.

services:
  app:
    # Built and published by .github/workflows/publish-image.yml on every push
    # to the default branch and every `v*` tag. Pulling a prebuilt multi-arch
    # image keeps the deploy to a download instead of running the whole Next.js
    # build on the server. The package must be public for this anonymous pull
    # to work — a private one answers `denied`, which reads like bad
    # credentials but is really a 404.
    image: ghcr.io/defy-works/sendsprite:latest
    # Coolify's deploy webhook (publish-image.yml calls it after every push
    # to the default branch) restarts the service but never re-pulls an image
    # the host already has, even with `force=true` — so without this a
    # redeploy just booted the old `:latest` again. `always` makes every
    # `docker compose up` pull first; the cost is a few seconds of extra
    # downtime while the layers download.
    pull_policy: always
    environment:
      # Assigns a domain routed to port 3000, and hands the app its own public
      # URL. It must end up https:// — the one-click AWS setup refuses to start
      # otherwise, because the HTTP->HTTPS redirect would drop the callback POST
      # body. Coolify issues a certificate automatically for a real domain.
      #
      # Two Coolify rules meet here, and getting either wrong yields an empty
      # APP_URL that only surfaces as a boot-time validation error:
      #   - the port suffix belongs on the *declaration*, where it tells the
      #     proxy which container port to route to. A reference never carries
      #     it: `${SERVICE_URL_APP_3000}` is not a variable Coolify generates,
      #     so it expands to the empty string.
      #   - `URL` renders with the scheme (https://app-xxxx.example.com) and
      #     `FQDN` renders bare (app-xxxx.example.com), so this one has to be
      #     the URL form.
      # The scheme follows the domain set on the resource in Coolify, which
      # therefore has to be entered there as https://.
      - SERVICE_URL_APP_3000
      - APP_URL=${SERVICE_URL_APP}
      # Generated once, then stored by Coolify. Every AWS and Cloudflare
      # credential in the database is encrypted with a key derived from it, so
      # changing it later makes those unreadable — rotate it only deliberately.
      - APP_SECRET=${SERVICE_HEX_64_APPSECRET}
      - DATABASE_URL=postgres://sendsprite:${SERVICE_PASSWORD_POSTGRES}@db:5432/sendsprite
      # Background jobs (sending, domain verification, webhook retries) run in
      # this container. See the note at the bottom about running them separately.
      - WORKER_MODE=${WORKER_MODE:-inline}
      # `auto` makes the first account the instance owner and everyone after
      # that invite-only. Other values: open, invite, closed.
      - SIGNUP_MODE=${SIGNUP_MODE:-auto}
      - EMAIL_PASSWORD_ENABLED=${EMAIL_PASSWORD_ENABLED:-true}
      - LANDING_ENABLED=${LANDING_ENABLED:-true}
      # The SMTP relay is off here: it speaks raw TCP, which cannot go through
      # Coolify's HTTP proxy, so it needs a published host port (see below).
      - SMTP_ENABLED=${SMTP_ENABLED:-false}
      # Fixed: the container runs as a non-root user and cannot bind below
      # 1024. SMTP_PORT below is the port on the *host*, mapped onto this one.
      - SMTP_PORT=2587
      - SMTP_MAX_SIZE=${SMTP_MAX_SIZE:-10485760}
      # Own STARTTLS certificate: set SMTP_TLS_DIR (below) to a host directory
      # holding the PEM files; it is mounted at /certs, so these are
      # /certs/<file>. Unset: a self-signed pair is generated.
      - SMTP_TLS_CERT=${SMTP_TLS_CERT:-}
      - SMTP_TLS_KEY=${SMTP_TLS_KEY:-}
      # Comma-separated emails that always have instance-admin access — the
      # lockout escape hatch. Unset: the first account to sign up is flagged.
      - INSTANCE_ADMIN_EMAILS=${INSTANCE_ADMIN_EMAILS:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      # S3 URL of the one-click CloudFormation template. Empty: Sendsprite's
      # public bucket. Point it at your own copy to audit what you deploy.
      - CFN_TEMPLATE_URL=${CFN_TEMPLATE_URL:-}
      # Cloudflare OAuth client (Manage Account -> OAuth clients) so Sendsprite
      # can write DNS records itself once a domain owner authorises it. Its
      # redirect URI must be exactly <APP_URL>/api/setup/cloudflare/callback.
      # Empty: domains show the records to add by hand.
      - CLOUDFLARE_OAUTH_CLIENT_ID=${CLOUDFLARE_OAUTH_CLIENT_ID:-}
      - CLOUDFLARE_OAUTH_CLIENT_SECRET=${CLOUDFLARE_OAUTH_CLIENT_SECRET:-}
      - CLOUDFLARE_OAUTH_SCOPES=${CLOUDFLARE_OAUTH_SCOPES:-}
      # Optional OAuth sign-in; leave empty to offer email + password only.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      # Hosted-service billing (Polar). Off by default: a self-hosted instance
      # has no Billing page, no checkout and no plan limits. Turning it on
      # needs the token and webhook secret, and DEFAULT_PLAN must be set in the
      # same deploy (anything but `free` is refused while billing is off).
      - BILLING_ENABLED=${BILLING_ENABLED:-false}
      - POLAR_ACCESS_TOKEN=${POLAR_ACCESS_TOKEN:-}
      - POLAR_WEBHOOK_SECRET=${POLAR_WEBHOOK_SECRET:-}
      - POLAR_SERVER=${POLAR_SERVER:-production}
      - POLAR_METER_ID=${POLAR_METER_ID:-}
      - BILLING_EVENT_NAME=${BILLING_EVENT_NAME:-email.sent}
      - DEFAULT_PLAN=${DEFAULT_PLAN:-free}
    # Coolify reads this file from git and strips comments, so nothing here
    # can be "uncommented" on the server: every switch is a variable.
    #
    # SMTP is raw TCP and cannot go through Coolify's HTTP proxy, so it is
    # published straight on the host. Off by default: bound to loopback on an
    # unprivileged port, where it collides with nothing. To accept mail set
    # SMTP_ENABLED=true, SMTP_BIND=0.0.0.0 and SMTP_PORT=587 (check nothing
    # else holds 587, and open it in the firewall).
    ports:
      - "${SMTP_BIND:-127.0.0.1}:${SMTP_PORT:-2587}:2587"
    # SMTP_TLS_DIR is a host directory with the PEM files, mounted read-only
    # at /certs. Unset it falls back to an empty named volume, so the mount
    # is harmless until you need it.
    volumes:
      - ${SMTP_TLS_DIR:-sendsprite-tls}:/certs:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=sendsprite
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=sendsprite
    volumes:
      - sendsprite-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sendsprite -d sendsprite"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  sendsprite-pgdata:
  sendsprite-tls:
# Scaling the worker out: set WORKER_MODE=separate above and add a second
# service with the same image, the same DATABASE_URL and APP_SECRET,
# WORKER_MODE=inline, SMTP_ENABLED=false and no domain. Migrations run at boot
# in whichever container starts first, guarded by an advisory lock.
