name: Release
# Changesets two-step release: a push to the default branch with pending
# changesets opens (or refreshes) a "Version Packages" PR; merging that PR
# leaves no changesets behind, so the same workflow run publishes instead.
# Only `sendsprite` and `@sendsprite/mcp` are published — `@sendsprite/web` and
# `@sendsprite/shared` are in `.changeset/config.json`'s `ignore` list.
on:
  push:
    # Both names are listed so the workflow exists whichever the repository
    # ends up using; the job itself only ever runs on the default branch.
    branches: [main, master]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    # Never version or publish from a non-default branch.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # changesets/action needs the full history to work out what changed.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # changeset publish shells out to npm, which reads the token from
      # ~/.npmrc; the repo itself never contains a token.
      - name: Authenticate to npm
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: changesets/action@v1
        with:
          version: bun run version-packages
          publish: bun run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
